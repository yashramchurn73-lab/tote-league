<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brothers' Tote League</title>
<meta name="theme-color" content="#1f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tote League">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2a22;--mute:#6b766e;--green:#1f6b3a;--gold:#c9952b;--red:#b3392f;--line:#e2ddd2}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:flex-start;gap:8px}
header .t{flex:1}
header h1{margin:0;font-size:19px}
#sub{font-size:13px;opacity:.88;margin-top:2px}
#who{font-size:12px;opacity:.9;text-align:right}
#who button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:3px 7px;font-size:12px;margin-top:3px;cursor:pointer}
nav{display:flex;background:var(--green);padding:0 6px;gap:2px;position:sticky;top:0;z-index:5;overflow-x:auto}
nav:empty{display:none}
nav button{flex:1;background:none;border:0;color:#cfe6d6;padding:10px 6px;font:600 14px system-ui,sans-serif;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:#fff;border-color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 4px}
.hint{color:var(--mute);font-size:13px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row>label{min-width:58px;font-weight:700;font-size:14px;line-height:1.2}
.row>label small{font-weight:400}
select,input,textarea{font:inherit;font-size:16px;width:100%;padding:9px;border:1px solid #cfc9bc;border-radius:8px;background:#fff;color:var(--ink);min-width:0}
select:disabled{background:#f1efe9;color:#555}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:220px}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin-top:6px}
.btn.alt{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--green);font-weight:600;text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--gold);color:#fff;margin-left:3px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{font-weight:700}
.win{color:var(--green)}.lose{color:var(--red)}.pend,.none{color:var(--mute)}
.save-bar{position:sticky;bottom:0;padding:12px 0 6px;background:linear-gradient(rgba(244,241,234,0),var(--bg) 35%)}
.status{font-size:13px;text-align:center;color:var(--mute);margin-top:6px}
.warn{color:var(--red);font-size:13px;margin:4px 0}
.total{font-size:22px;font-weight:800;color:var(--green)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.rr{border-top:1px solid var(--line);padding:10px 0}
.rr:first-of-type{border-top:0}
.rank{display:inline-block;width:22px;font-weight:800;color:var(--gold)}
.small{font-size:12px;color:var(--mute)}
.login{max-width:380px;margin:30px auto}
.login label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2a22;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="t"><h1>🐎 Brothers' Tote League</h1><div id="sub"></div></div><div id="who"></div></header>
<nav id="nav"></nav>
<main id="app"><div class="card">Loading…</div></main>
<div id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAt4lEUtH3pWF1Z-QRgqXQV3DEho25xkOA",
  authDomain: "tote-league.firebaseapp.com",
  projectId: "tote-league",
  storageBucket: "tote-league.firebasestorage.app",
  messagingSenderId: "996975004815",
  appId: "1:996975004815:web:8071f90e472b9ae82db4fa"
};
const ADMIN_USER = 'yash';
const DOMAIN = '@tote-league.app';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const PTS={place:[0,10,7,5],group:{1:25,2:20,3:15},banker:20,outsider:25,odds:20,acc:20,loser:15};
const S={tab:(location.hash||'#picks').slice(1),user:null,uid:null,username:null,admin:false,m:null,mLoaded:false,
  players:{},entries:{},hist:[],users:{},draft:null,draftFor:null,dirty:false,actAs:null,form:{},pend:false,
  wasLocked:null,saving:false,loginMode:'in',err:null,unsubs:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=iso=>iso?new Date(iso).toLocaleString('en-GB',{timeZone:'Indian/Mauritius',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const toLocalInput=iso=>{if(!iso)return'';const d=new Date(Date.parse(iso)+4*3600e3);return d.toISOString().slice(0,16);};
const fromLocalInput=v=>v?new Date(v+':00+04:00').toISOString():null;
const nums=s=>String(s||'').split(/[^0-9]+/).filter(Boolean).map(Number);
const ord=['Unplaced','1st','2nd','3rd'];
const cleanUser=u=>String(u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2800);}
let wq=Promise.resolve();
function write(fn,msg){wq=wq.then(fn).then(()=>{toast(msg||'Saved ✅');return true;}).catch(e=>{console.error(e);toast('Could not save ('+((e&&e.code)||'error').replace('firestore/','')+')');return false;});return wq;}

/* ---------- helpers ---------- */
function deadlinePassed(){return S.m&&S.m.deadline&&Date.now()>=Date.parse(S.m.deadline);}
function isLocked(){return deadlinePassed()&&!S.admin;}
function clock(){if(!S.m||!S.m.deadline)return'';const ms=Date.parse(S.m.deadline)-Date.now();if(ms<=0)return'';const t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),mi=Math.floor(t%3600/60),s=t%60,p=n=>String(n).padStart(2,'0');return(d?d+'d ':'')+p(h)+':'+p(mi)+':'+p(s);}
function cd(){if(!S.m||!S.m.deadline)return'';const c=clock();return c?'Picks close in '+c:'Picks closed';}
function pk(v){if(!v)return null;const [r,h]=String(v).split('-').map(Number);return r&&h?{r,h}:null;}
function horse(m,r,h){const rc=m.races.find(x=>x.n==r);return rc&&rc.horses.find(x=>x.no==h);}
function hl(m,r,h){const x=horse(m,r,h);return 'R'+r+' #'+h+' '+(x?x.name:'?');}
function playerIds(){return Object.keys(S.players).sort((a,b)=>(S.players[a].name||'').localeCompare(S.players[b].name||''));}
function pname(uid){return (S.players[uid]&&S.players[uid].name)||'?';}
function entryFor(uid){const e=S.entries[uid];return e&&S.m&&e.date===S.m.date&&e.picks?e:null;}
function fv(k,d){return Object.prototype.hasOwnProperty.call(S.form,k)?S.form[k]:d;}
function isPlayer(){return !!(S.uid&&S.players[S.uid]);}

/* ---------- scoring ---------- */
function result(m,r,h){
  const res=(m.results||{})[r];
  if(!res||!(res.p1||[]).length)return{ps:null};
  let hh=h,sub=null;
  if((res.out||[]).includes(h)){if(!res.fav)return{ps:null,sub:'?'};hh=res.fav;sub=res.fav;}
  const ps=(res.p1||[]).includes(hh)?1:(res.p2||[]).includes(hh)?2:(res.p3||[]).includes(hh)?3:0;
  return{ps,sub};
}
function score(m,e){
  const p=(e&&e.picks)||{};const it=[];
  const add=(cat,r,h,fn)=>{
    if(!r||!h){it.push({cat,txt:'— no pick',res:'',pts:0,st:'none'});return;}
    const {ps,sub}=result(m,r,h);const pts=ps==null?0:fn(ps);
    it.push({cat,txt:hl(m,r,h)+(sub?' → fav #'+sub:''),res:ps==null?'pending':ord[ps],pts,st:ps==null?'pend':pts>0?'win':'lose'});
  };
  m.races.forEach(rc=>{const g=+rc.group||0;add('Race '+rc.n+(g?' (G'+g+')':''),rc.n,(p.race||{})[rc.n],ps=>g?(ps===1?PTS.group[g]:0):PTS.place[ps]);});
  [0,1].forEach(i=>{const x=pk((p.bankers||[])[i]);add('Banker '+(i+1),x&&x.r,x&&x.h,ps=>ps===1?PTS.banker:0);});
  [0,1].forEach(i=>{const x=pk((p.outsiders||[])[i]);add('Outsider '+(i+1),x&&x.r,x&&x.h,ps=>ps===1?PTS.outsider:0);});
  {const x=pk(p.oddsHorse);add('Odds horse',x&&x.r,x&&x.h,ps=>ps>=1&&ps<=3?PTS.odds:0);}
  [0,1].forEach(i=>{const x=pk((p.losers||[])[i]);add('Fav to lose '+(i+1),x&&x.r,x&&x.h,ps=>ps!==1?PTS.loser:0);});
  const acc=p.acc||{};let missing=false;
  const parts=m.races.map(rc=>{const h=acc[rc.n];if(!h){missing=true;return null;}return result(m,rc.n,h).ps;});
  let pts=0,res,st='pend';
  if(missing){st='none';res='incomplete';}
  else if(parts.some(x=>x===0)){st='lose';res='lost';}
  else if(parts.every(x=>x>=1)){st='win';pts=PTS.acc;res='all placed';}
  else res=parts.filter(x=>x>=1).length+'/'+parts.length+' placed';
  it.push({cat:'Place accumulator',txt:missing?'— incomplete':m.races.map(rc=>'R'+rc.n+' #'+acc[rc.n]).join(' · '),res,pts,st});
  return{items:it,total:it.reduce((a,b)=>a+b.pts,0)};
}

/* ---------- draft ---------- */
function emptyPicks(){return{race:{},acc:{},bankers:['',''],outsiders:['',''],oddsHorse:'',losers:['','']};}
function targetUid(){return S.actAs||S.uid;}
function syncDraft(){
  if(!S.m)return;const key=targetUid()+'|'+S.m.date;
  if(S.dirty&&S.draftFor===key)return;
  const e=entryFor(targetUid());
  const d=emptyPicks();Object.assign(d,JSON.parse(JSON.stringify((e&&e.picks)||{})));
  d.race=d.race||{};d.acc=d.acc||{};
  ['bankers','outsiders','losers'].forEach(k=>{d[k]=[(d[k]||[])[0]||'',(d[k]||[])[1]||''];});
  S.draft=d;S.draftFor=key;S.dirty=false;S.savedAt=e&&e.updatedAt;
}

/* ---------- views ---------- */
function vLogin(){
  const up=S.loginMode==='up';
  return '<div class="card login"><h2>'+(up?'Create your account':'Sign in')+'</h2>'+
    '<p class="hint">'+(up?'Pick a username and a password (at least 6 characters). Yash then adds you to the league.':'Use the username and password you created.')+'</p>'+
    '<form id="loginForm"><label>Username</label><input id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="e.g. ayush" required>'+
    '<label>Password</label><input id="lp" type="password" autocomplete="'+(up?'new-password':'current-password')+'" required>'+
    (up?'<label>Repeat password</label><input id="lp2" type="password" autocomplete="new-password" required>':'')+
    (S.err?'<p class="warn">'+esc(S.err)+'</p>':'')+
    '<div style="margin-top:14px"><button class="btn" type="submit"'+(S.saving?' disabled':'')+'>'+(S.saving?'Please wait…':(up?'Create account':'Sign in'))+'</button></div></form>'+
    '<button class="link" data-act="toggleLogin">'+(up?'I already have an account':'First time? Create an account')+'</button></div>';
}

function raceOpts(rc,val){return rc.horses.map(h=>'<option value="'+h.no+'"'+(+val===h.no?' selected':'')+'>#'+h.no+' '+esc(h.name)+' · Rs'+h.odds+'</option>').join('');}
function anyOpts(m,filter,val){return m.races.map(rc=>{const hs=rc.horses.filter(filter);if(!hs.length)return'';return '<optgroup label="Race '+rc.n+'">'+hs.map(h=>{const v=rc.n+'-'+h.no;return '<option value="'+v+'"'+(val===v?' selected':'')+'>R'+rc.n+' #'+h.no+' '+esc(h.name)+' · Rs'+h.odds+'</option>';}).join('')+'</optgroup>';}).join('');}

function vPicks(){
  const m=S.m;let h='';
  if(!isPlayer()&&!S.admin){
    if(S.myStatus==='rejected')return '<div class="card"><h2>Not accepted</h2><p class="hint">Your request to join the league was not accepted. If you think this is a mistake, speak to Yash.</p></div>';
    return '<div class="card"><h2>Almost there 👋</h2><p class="hint">Your account <b>'+esc(S.username)+'</b> is created. Ask Yash to add you to the league — this page updates by itself once he does.</p></div>';
  }
  if(m&&m.deadline){const c=clock();h+='<div class="card" style="text-align:center">'+(c?'<div class="small">Picks close in</div><div id="bigcd" style="font:800 34px ui-monospace,Menlo,monospace;color:var(--green);letter-spacing:1px">'+c+'</div><div class="small">'+esc(fmt(m.deadline))+'</div>':'<b>🔒 Picks closed</b> <span class="small">'+esc(fmt(m.deadline))+'</span>')+'</div>';}
  if(!m)return '<div class="card"><h2>No race day set up yet</h2><p class="hint">'+(S.admin?'Go to Admin and paste this week\'s race card and odds.':'Check back once Yash adds this week\'s race card.')+'</p></div>';
  if(S.admin){
    const ids=playerIds();
    h+='<div class="card"><div class="row"><label>Picks for</label><select id="actAs">'+
      (isPlayer()?'':'<option value="">— choose a player —</option>')+
      ids.map(id=>'<option value="'+id+'"'+((S.actAs||S.uid)===id?' selected':'')+'>'+esc(pname(id))+(id===S.uid?' (me)':'')+'</option>').join('')+
      '</select></div><p class="hint">Switch to a brother to type in picks he sent you on WhatsApp.</p></div>';
    if(!S.players[targetUid()])return h+(ids.length?'':'<div class="card"><p class="hint">No players yet — add them in Admin (add yourself too).</p></div>');
  }
  const d=S.draft,dis=isLocked()?' disabled':'';
  const sel=(k,opts)=>'<select data-k="'+k+'"'+dis+'><option value="">— choose —</option>'+opts+'</select>';
  if(isLocked())h+='<div class="card"><b>🔒 Picks are closed.</b> <span class="hint">See All picks and Scores.</span></div>';
  if(entryFor(targetUid())&&!S.dirty)h+='<div class="card"><div class="row" style="margin:0"><span style="flex:1"><b>✅ Picks saved.</b> <span class="small">Keep a copy for yourself.</span></span><button class="btn sm" style="margin:0" data-act="imgpicks" data-u="'+targetUid()+'">📷 Save as image</button></div>'+(S.imgUrl?'<p class="small" style="margin:8px 0 0">If nothing downloaded, <a href="'+S.imgUrl+'" download="'+esc(S.imgName||'picks')+'.png">tap here</a> or long-press the image below and choose Save.</p><img src="'+S.imgUrl+'" style="width:100%;margin-top:8px;border-radius:8px">':'')+'</div>';
  h+='<div class="card"><h2>Race picks — '+esc(pname(targetUid()))+'</h2><p class="hint">One horse per race. 1st 10 · 2nd 7 · 3rd 5. Group races pay only a win: G3 15 · G2 20 · G1 25.</p>'+
    m.races.map(rc=>'<div class="row"><label>R'+rc.n+(rc.group?'<span class="badge">G'+rc.group+'</span>':'')+'<br><small class="pend">'+esc(rc.time||'')+'</small></label>'+sel('race.'+rc.n,raceOpts(rc,d.race[rc.n]))+'</div>').join('')+'</div>';
  const two=(key,filter)=>[0,1].map(i=>'<div class="row"><label>'+(i+1)+'</label>'+sel(key+'.'+i,anyOpts(m,filter,d[key][i]))+'</div>').join('')+(d[key][0]&&d[key][0]===d[key][1]?'<p class="warn">Both picks are the same horse.</p>':'');
  h+='<div class="card"><h2>🏦 Bankers</h2><p class="hint">Any horse. 20 pts each — must WIN.</p>'+two('bankers',()=>true)+'</div>';
  h+='<div class="card"><h2>🎯 Outsiders</h2><p class="hint">Odds Rs'+m.outsiderMin+' or more. 25 pts each — must WIN.</p>'+two('outsiders',x=>x.odds>=m.outsiderMin)+'</div>';
  h+='<div class="card"><h2>💰 Odds horse</h2><p class="hint">Odds Rs'+m.oddsMin+' or more. 20 pts if it finishes top 3.</p><div class="row"><label>1</label>'+sel('oddsHorse',anyOpts(m,x=>x.odds>=m.oddsMin,d.oddsHorse))+'</div></div>';
  h+='<div class="card"><h2>👎 Favourites to lose</h2><p class="hint">Odds under Rs'+m.loserMax+'. 15 pts each if it does NOT win.</p>'+two('losers',x=>x.odds<m.loserMax)+'</div>';
  h+='<div class="card"><h2>🔗 Place accumulator</h2><p class="hint">One horse per race. 20 pts only if every one finishes top 3.</p>'+
    m.races.map(rc=>'<div class="row"><label>R'+rc.n+'</label>'+sel('acc.'+rc.n,raceOpts(rc,d.acc[rc.n]))+'</div>').join('')+'</div>';
  if(!isLocked()){
    const filled=m.races.filter(rc=>d.race[rc.n]).length+m.races.filter(rc=>d.acc[rc.n]).length+[...d.bankers,...d.outsiders,...d.losers,d.oddsHorse].filter(Boolean).length;
    const total=m.races.length*2+7;
    h+='<div class="save-bar"><button class="btn" data-act="save"'+(S.saving?' disabled':'')+'>'+(S.saving?'Saving…':'Save picks')+'</button><div class="status">'+filled+'/'+total+' chosen · '+
      (S.dirty?'<b style="color:var(--red)">Unsaved changes</b>':S.savedAt?'Saved '+fmt(S.savedAt):'Not saved yet')+'</div></div>';
  }
  return h;
}

function itemsTable(items){return '<table><tr><th>Pick</th><th>Horse</th><th>Result</th><th class="n">Pts</th></tr>'+items.map(i=>'<tr><td>'+esc(i.cat)+'</td><td>'+esc(i.txt)+'</td><td class="'+i.st+'">'+esc(i.res||'—')+'</td><td class="n '+i.st+'">'+(i.st==='pend'?'…':i.pts)+'</td></tr>').join('')+'</table>';}

function vAll(){
  const m=S.m;if(!m)return '<div class="card"><p class="hint">No race day yet.</p></div>';
  const rows=playerIds().map(id=>({id,p:pname(id),e:entryFor(id)}));
  if(!deadlinePassed())return '<div class="card"><h2>Who\'s in?</h2><p class="hint">Everyone\'s picks are revealed when picks close ('+esc(fmt(m.deadline))+').</p><table>'+rows.map(r=>'<tr><td><b>'+esc(r.p)+'</b></td><td>'+(r.e?'✅ Picks in':'⏳ Not yet')+'</td></tr>').join('')+'</table></div>';
  return rows.map(r=>{if(!r.e)return '<div class="card"><h2>'+esc(r.p)+'</h2><p class="hint">No picks submitted.</p></div>';const sc=score(m,r.e);
    return '<div class="card"><h2>'+esc(r.p)+'<span class="total" style="float:right">'+sc.total+'</span></h2>'+itemsTable(sc.items)+
      '<button class="btn sm alt" data-act="imgreport" data-u="'+r.id+'">📷 Save '+esc(r.p)+'\'s report as image</button></div>';}).join('')+
    (S.imgUrl?'<div class="card"><p class="small">If nothing downloaded, long-press the image and choose Save.</p><img src="'+S.imgUrl+'" style="width:100%;border-radius:8px"></div>':'');
}

function racesDone(m){return m?m.races.filter(rc=>((m.results||{})[rc.n]||{}).p1&&m.results[rc.n].p1.length).length:0;}
function allDone(m){return !!m&&m.races.length>0&&racesDone(m)===m.races.length;}
// scores for today keyed by uid: {uid:{name,total}}
function todayScores(){const m=S.m;const o={};playerIds().forEach(id=>{const e=entryFor(id);o[id]={name:pname(id),total:e?score(m,e).total:0};});return o;}
function histVal(v){return typeof v==='number'?v:(v&&+v.total)||0;}
function seasonTable(){
  const m=S.m;const season={};
  playerIds().forEach(id=>season[id]=+(S.players[id].startPoints||0));
  S.hist.forEach(x=>Object.keys(x.scores||{}).forEach(id=>{if(id in season)season[id]+=histVal(x.scores[id]);}));

  return Object.keys(season).map(id=>({id,p:pname(id),t:season[id]})).sort((a,b)=>b.t-a.t);

/* ---------- images ---------- */
function drawCard(title,sub,rows,footer){
  const W=1080,pad=48,rowH=58,headH=210,footH=footer?120:60;
  const c=document.createElement('canvas');c.width=W;c.height=headH+rows.length*rowH+footH;
  const g=c.getContext('2d');
  g.fillStyle='#f4f1ea';g.fillRect(0,0,W,c.height);
  g.fillStyle='#1f6b3a';g.fillRect(0,0,W,headH-30);
  g.fillStyle='#fff';g.font='bold 54px system-ui,sans-serif';g.fillText('🐎 '+title,pad,90);
  g.font='32px system-ui,sans-serif';g.fillStyle='#cfe6d6';g.fillText(sub,pad,142);
  let y=headH+10;
  rows.forEach((r,i)=>{
    if(r.head){g.fillStyle='#c9952b';g.font='bold 30px system-ui,sans-serif';g.fillText(r.head,pad,y+28);y+=rowH;return;}
    if(i%2){g.fillStyle='#ebe6da';g.fillRect(pad-12,y-6,W-2*pad+24,rowH);}
    g.fillStyle='#1d2a22';g.font='bold 30px system-ui,sans-serif';g.fillText(r[0],pad,y+34);
    g.font='30px system-ui,sans-serif';let t=String(r[1]||'');while(g.measureText(t).width>(r[2]!=null?560:740)&&t.length>3)t=t.slice(0,-2);g.fillText(t,pad+260,y+34);
    if(r[2]!=null){g.textAlign='right';g.fillStyle=r[3]==='win'?'#1f6b3a':r[3]==='lose'?'#b3392f':'#6b766e';g.font='bold 30px system-ui,sans-serif';g.fillText(String(r[2]),W-pad,y+34);g.textAlign='left';}
    y+=rowH;
  });
  if(footer){g.fillStyle='#1f6b3a';g.font='bold 44px system-ui,sans-serif';g.fillText(footer,pad,y+70);}
  return c;
}
async function shareCanvas(c,name){
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],name+'.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const url=URL.createObjectURL(blob);
  S.imgUrl=url;S.imgName=name;render();
  const a=document.createElement('a');a.href=url;a.download=name+'.png';document.body.appendChild(a);a.click();a.remove();
}
function picksRows(m,e){
  const p=(e&&e.picks)||{};const rows=[];const L=(r,h)=>r&&h?hl(m,r,h):'—';
  rows.push({head:'RACE PICKS'});
  m.races.forEach(rc=>rows.push(['Race '+rc.n+(rc.group?' (G'+rc.group+')':''),L(rc.n,(p.race||{})[rc.n])]));
  rows.push({head:'SPECIALS'});
  [0,1].forEach(i=>{const x=pk((p.bankers||[])[i]);rows.push(['Banker '+(i+1),x?L(x.r,x.h):'—']);});
  [0,1].forEach(i=>{const x=pk((p.outsiders||[])[i]);rows.push(['Outsider '+(i+1),x?L(x.r,x.h):'—']);});
  {const x=pk(p.oddsHorse);rows.push(['Odds horse',x?L(x.r,x.h):'—']);}
  [0,1].forEach(i=>{const x=pk((p.losers||[])[i]);rows.push(['Fav to lose '+(i+1),x?L(x.r,x.h):'—']);});
  rows.push({head:'PLACE ACCUMULATOR'});
  rows.push(['Horses',m.races.map(rc=>'R'+rc.n+' #'+((p.acc||{})[rc.n]||'–')).join(' ')]);
  return rows;
}

function cardText(m){return(m?m.races:[]).map(r=>'R'+r.n+' '+(r.time||'')+'\n'+r.horses.map(h=>h.no+' '+h.name+' '+h.odds).join('\n')).join('\n\n');}
function parseCard(txt){const races=[];let cur=null;String(txt||'').split('\n').forEach(line=>{const l=line.trim();if(!l)return;let mm=l.match(/^R(?:ace)?\s*(\d+)\b\s*(.*)$/i);if(mm){cur={n:+mm[1],time:mm[2].trim(),group:0,horses:[]};races.push(cur);return;}mm=l.match(/^(\d+)[\s.)-]+(.+?)\s+(?:Rs\.?\s*)?(\d+)$/i);if(mm&&cur)cur.horses.push({no:+mm[1],name:mm[2].trim(),odds:+mm[3]});});return races.filter(r=>r.horses.length);}

}
function addPlayer(id){const u=S.users[id]||{};const name=String(fv('pl.'+id,u.username||'')).trim();if(!name){toast('Type a name.');return;}delete S.form['pl.'+id];write(()=>setDoc(doc(db,'players',id),{name,username:u.username||''}),name+' added ✅');}
function rmPlayer(id){if(S.confirmRm!==id){S.confirmRm=id;toast('Tap Remove again to confirm');setTimeout(()=>{if(S.confirmRm===id)S.confirmRm=null;},4000);return;}S.confirmRm=null;write(()=>deleteDoc(doc(db,'players',id)),'Removed');}

/* ---------- events ---------- */
document.addEventListener('submit',ev=>{if(ev.target.id==='loginForm'){ev.preventDefault();doLogin();}});
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.imgUrl=null;try{history.replaceState(null,'','#'+S.tab);}catch(e){}render();window.scrollTo(0,0);return;}
  const a=t.dataset.act;if(!a)return;
  if(a==='toggleLogin'){S.loginMode=S.loginMode==='up'?'in':'up';S.err=null;render();return;}
  if(a==='logout'){signOut(auth);return;}
  if(a==='save'){savePicks();return;}
  if(a==='imgpicks'){imgPicks(t.dataset.u);return;}
  if(a==='imgreport'){imgReport(t.dataset.u);return;}
  if(a==='imgboard'){imgBoard();return;}
  if(a==='savename'){saveName();return;}
  if(a==='changepw'){changePw();return;}
  if(!S.admin)return;
  if(a==='saveres')saveRes(+t.dataset.r);
  else if(a==='saveset')saveSet();
  else if(a==='season')saveSeason();
  else if(a==='savecard')saveCard();
  else if(a==='addplayer')addPlayer(t.dataset.u);
  else if(a==='rmplayer')rmPlayer(t.dataset.u);
  else if(a==='reject')rejectUser(t.dataset.u);
  else if(a==='unreject')unreject(t.dataset.u);
  else if(a==='savestart')saveStart(t.dataset.u);
});
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.fk;if(k)S.form[k]=ev.target.value;});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='actAs'){S.actAs=(t.value&&t.value!==S.uid)?t.value:null;S.dirty=false;S.draftFor=null;syncDraft();render();return;}
  if(t.dataset.fk){S.form[t.dataset.fk]=t.value;return;}
  if(t.dataset.g&&S.admin){const n=+t.dataset.g;const races=S.m.races.map(r=>Object.assign({},r,{group:r.n===n?+t.value:(+r.group||0)}));write(()=>updateDoc(doc(db,'meeting','current'),{races}),'Race '+n+' updated ✅');return;}
  const k=t.dataset.k;if(!k||!S.draft)return;const [a,b]=k.split('.');
  if(a==='race'||a==='acc'){if(t.value)S.draft[a][b]=+t.value;else delete S.draft[a][b];}
  else if(b!==undefined)S.draft[a][+b]=t.value;else S.draft[a]=t.value;
  S.dirty=true;render();
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pend)render();},400));
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t&&t!==S.tab){S.tab=t;render();}});
setInterval(()=>{const el=document.getElementById('cd');if(el)el.textContent=cd();const b=document.getElementById('bigcd');if(b)b.textContent=clock();const l=!!deadlinePassed();if(S.wasLocked!==null&&l!==S.wasLocked)render();S.wasLocked=l;},1000);

/* ---------- render ---------- */
function render(){
  try{autoSeason();}catch(e){console.error(e);}
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&$('#app').contains(ae)&&ae.closest('#loginForm')==null){S.pend=true;return;}
  S.pend=false;
  $('#who').innerHTML=S.user?'<div>'+esc(isPlayer()?pname(S.uid):S.username||'')+'</div><button data-act="logout">Sign out</button>':'';
  if(!S.user){
    $('#nav').innerHTML='';$('#sub').innerHTML='';
    if(S.authReady){const lu=$('#lu')&&$('#lu').value;$('#app').innerHTML=vLogin();if(lu&&$('#lu'))$('#lu').value=lu;}
    return;
  }
  const tabs=[['picks','Picks'],['all','All picks'],['board','Scores']];if(S.admin)tabs.push(['admin','Admin']);tabs.push(['settings','⚙️']);
  if(!tabs.some(t=>t[0]===S.tab))S.tab='picks';
  $('#nav').innerHTML=tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('');
  $('#sub').innerHTML=S.m?esc(S.m.title||S.m.date)+' · <span id="cd">'+esc(cd())+'</span>':'';
  let h='';
  if(S.err)h+='<div class="card warn">'+esc(S.err)+'</div>';
  if(!S.mLoaded)h+='<div class="card">Loading…</div>';
  else h+=(S.tab==='settings'?vSettings():({picks:vPicks,all:vAll,board:vBoard,admin:vAdmin})[S.tab]());
  $('#app').innerHTML=h;
}

/* ---------- data ---------- */
function stopAll(){S.unsubs.forEach(u=>{try{u();}catch(e){}});S.unsubs=[];}
function onErr(what){return e=>{console.error(what,e);S.err='Could not load '+what+' ('+(e.code||'error')+').';render();};}
function startData(){
  stopAll();
  S.unsubs.push(onSnapshot(collection(db,'players'),q=>{const o={};q.forEach(d=>o[d.id]=d.data());const was=isPlayer();S.players=o;if(!was&&isPlayer())startEntries();syncDraft();render();},onErr('players')));
  S.unsubs.push(onSnapshot(doc(db,'meeting','current'),s=>{
    S.m=s.exists()?Object.assign({outsiderMin:650,oddsMin:1000,loserMax:570,races:[],results:{}},s.data()):null;
    S.mLoaded=true;syncDraft();render();},e=>{S.mLoaded=true;onErr('the race day')(e);}));
  S.unsubs.push(onSnapshot(collection(db,'history'),q=>{S.hist=q.docs.map(d=>Object.assign({id:d.id},d.data()));S.histLoaded=true;render();},onErr('season')));
  if(S.admin)S.unsubs.push(onSnapshot(collection(db,'users'),q=>{const o={};q.forEach(d=>o[d.id]=d.data());S.users=o;render();},onErr('accounts')));
  else S.unsubs.push(onSnapshot(doc(db,'users',S.uid),s=>{if(s.exists()){S.username=s.data().username||S.username;S.myStatus=s.data().status||null;}render();},()=>{}));
  startEntries();
}
let entriesUnsub=null;
function startEntries(){
  if(entriesUnsub){try{entriesUnsub();}catch(e){}entriesUnsub=null;}
  if(!S.admin&&!isPlayer())return;
  entriesUnsub=onSnapshot(collection(db,'entries'),q=>{const o={};q.forEach(d=>o[d.id]=d.data());S.entries=o;S.entriesLoaded=true;syncDraft();render();},onErr('picks'));
  S.unsubs.push(()=>{if(entriesUnsub)entriesUnsub();});
}
onAuthStateChanged(auth,u=>{
  S.authReady=true;S.err=null;
  stopAll();S.user=u;S.uid=u?u.uid:null;S.m=null;S.mLoaded=false;S.players={};S.entries={};S.hist=[];S.users={};S.draft=null;S.draftFor=null;S.dirty=false;S.actAs=null;S.myStatus=null;S.imgUrl=null;S.entriesLoaded=false;S.histLoaded=false;S.pwErr=null;S.tab=S.tab||'picks';
  if(u){S.username=(u.email||'').replace(DOMAIN,'');S.admin=S.username===ADMIN_USER;startData();}
  else{S.admin=false;S.username=null;}
  render();
});
</script>
